name: Android CI

on:
  push:
    branches: [ "main", "main-compose", "news-compilation-compose-koin" ]
  pull_request:
    branches: [ "main", "main-compose" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle
    - name: Create secrets.properties
      run: echo "API_KEY=${{ secrets.API_KEY }}" >> secrets.properties

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
    - name: Set up Gradle
      uses: gradle/gradle-build-action@v2
    - name: Run tests with Gradle
      run: ./gradlew testDebugUnitTest
